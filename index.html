<html lang="de">
<head>
<meta charset="utf-8">

<title>Learnspot</title>

<style>
:root{--bg:#000;--panel:#0a0a0a;--ink:#f4f4f2;--mute:#8a8a8a;--line:#1f1f1f;--warm:#ffd166;--bad:#ff8a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;transition:background .2s,color .2s}
body[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--ink:#17191c;--mute:#68707a;--line:#dfe3e8;color-scheme:light}
body[data-theme="light"] #nav{background:rgba(255,255,255,.94)}
body[data-theme="light"] #nav button.on{color:#fff;background:#17191c}
body[data-theme="light"] .ringbox svg circle:first-child{stroke:#dfe3e8}
body[data-theme="light"] .bar{background:#dfe3e8}
body[data-theme="light"] .w.go,body[data-theme="light"] button.p{background:#17191c;color:#fff;border-color:#17191c}
body[data-theme="light"] .tabs button.on,body[data-theme="light"] .opts button.on{background:#17191c;color:#fff;border-color:#17191c}
body[data-theme="light"] .wk i{background:#17191c}
body[data-theme="light"] .ringbox svg circle:last-child{stroke:#17191c}
body[data-theme="light"] a{color:#2458a6!important}
main{max-width:720px;margin:0 auto;padding:24px 16px 110px}
h1,h2,h3{margin:0;line-height:1.1;font-weight:300}
h1{font-size:2.2rem}
h2{font-size:1.2rem;font-weight:600;margin:30px 0 12px}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #2a2a2a;background:var(--panel);border-radius:14px;padding:10px 14px;font-weight:600;transition:background .15s,transform .15s}
button:hover{background:#151515}
button.p{background:var(--ink);color:#000;border-color:var(--ink)}
button.p:hover{background:#fff}
button.big{width:100%;padding:18px;font-size:1.15rem;border-radius:20px}
button.g{border:none;background:none;color:var(--mute);padding:6px 8px}
button.g:hover{color:var(--ink);background:none}
:is(button,input,textarea,select,a):focus-visible{outline:2px solid #fff;outline-offset:3px}
input,textarea,select{width:100%;background:var(--panel);border:1px solid #2a2a2a;border-radius:14px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.wm{font-size:1.4rem;font-weight:300}.wm b{font-weight:800}
.ic{width:24px;height:24px;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.span2{grid-column:span 2}
.w{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;text-align:left;transition:transform .2s ease,border-color .2s,background .2s}
.w:hover,.w:focus-visible{transform:scale(1.04);border-color:#4a4a4a;background:#121212}
button.w{display:block;width:100%;font-weight:400}
.go{background:var(--ink);color:#000;display:flex!important;align-items:center;gap:14px;font-size:1.3rem;font-weight:600!important;border-color:var(--ink)}
.go:hover{background:#fff}
.num{font-size:2.8rem;font-weight:300;line-height:1;margin-top:10px;display:block}
.ringbox{position:relative;width:92px;height:92px;margin-top:6px}
.ringbox svg{transform:rotate(-90deg)}
.ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600}
.wk{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:10px}
.wk div{flex:1;text-align:center;font-size:.75rem;color:var(--mute)}
.wk i{display:block;background:#fff;border-radius:6px;margin-bottom:4px}
.fach{display:flex!important;flex-direction:column;align-items:flex-start;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.badge{background:var(--warm);color:#1b1300;border-radius:20px;padding:1px 10px;font-size:.8rem;font-weight:700}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1}
.tabs button.on,.opts button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.note{margin-bottom:10px}
.note img{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.note p{white-space:pre-wrap;margin:6px 0 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{height:64px;border-radius:8px}
.timer{font-size:5.5rem;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:20px 0}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
.opts{display:flex;gap:8px}.opts button{flex:1}
.q{font-size:1.4rem;font-weight:500;text-align:center;padding:28px 10px}
#nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#nav .wm{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:var(--mute);padding:6px;border-radius:14px;font-size:.75rem}
#nav button:hover{transform:scale(1.12);color:var(--ink);background:none}
#nav button.on{color:#000;background:var(--ink)}
@media(min-width:900px){
#nav{top:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:none;border-right:1px solid var(--line);padding:calc(28px + env(safe-area-inset-top,0px)) 14px 24px}
#nav .wm{display:block;margin:0 10px 28px;font-size:1.6rem}
#nav button{flex:none;flex-direction:row;gap:12px;font-size:1rem;padding:12px 14px;justify-content:flex-start}
main{margin:0 0 0 220px;max-width:none;width:calc(100% - 220px);min-width:0;padding:36px clamp(24px,3vw,56px) 60px;box-sizing:border-box}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(3deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,209,102,.3))}50%{filter:drop-shadow(0 0 10px rgba(255,209,102,.9))}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.fl{position:relative;display:inline-block;color:var(--mute)}
.sk:not(.on) .fl{animation:pulse 2.4s ease-in-out infinite}
.sk.on .fl{color:var(--warm);animation:flick 1.6s ease-in-out infinite,glow 2.4s ease-in-out infinite}
.sk i{position:absolute;left:50%;top:2px;width:4px;height:4px;border-radius:50%;background:var(--warm);opacity:0}
.sk.on i{animation:rise 2s ease-out infinite}
.sk.on i:nth-child(2){margin-left:-9px;animation-delay:.7s}
.sk.on i:nth-child(3){margin-left:7px;animation-delay:1.3s}
.wk i{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.wk div:nth-child(2) i{animation-delay:.05s}.wk div:nth-child(3) i{animation-delay:.1s}.wk div:nth-child(4) i{animation-delay:.15s}.wk div:nth-child(5) i{animation-delay:.2s}.wk div:nth-child(6) i{animation-delay:.25s}.wk div:nth-child(7) i{animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Auswahlfelder: ohne dekorativen Pfeil, Auswahl öffnet sich beim Antippen */
select{appearance:none;-webkit-appearance:none;color:var(--ink)!important;background-color:var(--panel)!important;border-color:var(--line);background-image:none!important;padding-right:12px;cursor:pointer}
select option{background:var(--panel);color:var(--ink)}

.map-stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.035),transparent 68%);pointer-events:none}
.map-world{position:absolute;inset:0;transform:translate3d(var(--pan-x,0px),var(--pan-y,0px),0) scale(var(--map-zoom,1));transform-origin:center;transition:transform .12s ease-out;}
.map-stage.panning{cursor:grabbing}.map-links{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none}
.map-links line{stroke:#aeb7c4;stroke-width:.38;stroke-linecap:round;opacity:.34;filter:none}
.map-pin{position:absolute;z-index:3;transform:translate(-50%,-50%);width:14px;height:14px;min-width:14px;padding:0!important;border:2px solid rgba(255,255,255,.82)!important;border-radius:50%!important;background:var(--pin-color,#ffd166)!important;box-shadow:0 2px 7px rgba(0,0,0,.38),inset 0 1px 2px rgba(255,255,255,.55);display:block;transition:transform .16s ease,box-shadow .16s ease}
.map-pin:hover{transform:translate(-50%,-50%) scale(1.3)}.map-pin.active{box-shadow:0 0 0 5px rgba(150,165,190,.2),0 2px 7px rgba(0,0,0,.38)}.map-pin.link-start{box-shadow:0 0 0 5px rgba(101,214,189,.24),0 2px 7px rgba(0,0,0,.38)}
.map-hint{position:absolute;left:14px;right:14px;bottom:12px;z-index:4;pointer-events:none;font-size:.8rem;color:#aeb7c4;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.map-editor{display:grid;gap:8px}.map-detail{margin-top:12px}.map-detail p{white-space:pre-wrap;margin:8px 0}.map-tools{display:flex;gap:8px;flex-wrap:wrap}.map-tools button{flex:1}
.map-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.map-toolbar button{flex:1}.map-toolbar button.on{background:var(--ink);color:var(--bg)}
.map-colors{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.map-color{width:25px;height:25px;min-width:25px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.65);box-shadow:0 1px 5px rgba(0,0,0,.3)}.map-color.chosen{outline:2px solid var(--ink);outline-offset:3px}
.map-links-list{display:grid;gap:7px;margin-top:10px}.map-link-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:.9rem}.map-link-row button{padding:5px 9px;font-size:.82rem}
.map-zoom{position:absolute;z-index:5;right:12px;top:12px;display:flex;gap:6px}.map-zoom button{width:36px;height:36px;padding:0;border-radius:11px;background:rgba(20,20,20,.9);border-color:#333;font-size:1.15rem}.map-stage .map-hint{color:#8d8d8d;text-shadow:none}body[data-theme="light"] .map-stage{background:#050505;border-color:#242424}body[data-theme="light"] .map-hint{color:#8d8d8d}
#nav button span{transition:transform .16s ease,opacity .16s ease}#nav button:hover span{transform:translateY(-2px);opacity:1}




.profile-head{margin-top:16px}.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.profile-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}.profile-placeholder{display:grid;place-items:center;background:#202329;color:#fff;font-size:2rem;font-weight:600}.friend-list{display:grid;gap:6px;margin-top:12px}.friend-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

.avatar-pick{position:relative;display:inline-block;cursor:pointer;border-radius:50%}
.avatar-pick .profile-avatar{transition:transform .16s ease,box-shadow .16s ease}
.avatar-pick:hover .profile-avatar{transform:scale(1.04);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.status-dot{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:50%;border:3px solid var(--panel);display:grid;place-items:center}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#6b7280}
.status-dot.abwesend{background:#ef4444}
.status-dot.abwesend span{display:block;width:8px;height:2px;border-radius:2px;background:#fff}
.status-opts{display:flex;gap:8px}
.status-opt{flex:1;padding:10px 8px;border-radius:14px;font-weight:600}
.status-opt.on{background:var(--ink);color:#000;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:80;background:var(--ink);color:#000;padding:10px 16px;border-radius:16px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:28px}}
.onboard{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px)}
.onboard-card{width:min(430px,100%);padding:24px}
.onboard-card h1{font-size:1.7rem}
.upper-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer}.upper-toggle input{appearance:none;-webkit-appearance:none;position:relative;width:44px;height:26px;flex:none;border:1px solid var(--line);border-radius:30px;background:#555;padding:0;margin:0;cursor:pointer;transition:background .2s}.upper-toggle input:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s}.upper-toggle input:checked{background:#22a65a}.upper-toggle input:checked:before{transform:translateX(18px)}
.onboard-progress{display:flex;gap:6px;margin:14px 0 24px}.onboard-progress i{height:4px;flex:1;background:var(--line);border-radius:9px}.onboard-progress i.active{background:var(--ink)}.onboard-nav{display:flex;gap:10px;margin-top:24px}.onboard-nav button:first-child{width:52px}.onboard-nav button:last-child{flex:1}.onboard-nav button:disabled{opacity:.25;cursor:default}.onboard-card{max-height:90vh;overflow:auto}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.theme-choice{display:flex;align-items:center;gap:9px;text-align:left;border-color:var(--line);font-weight:500;min-width:0}.theme-choice.chosen{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.theme-swatch{width:22px;height:22px;border-radius:50%;border:1px solid #8886;flex:none}.theme-check{margin-left:auto}.theme-choice:hover{background:var(--line)}
body[data-theme="ocean"]{--bg:#101b28;--panel:#172637;--ink:#dbeaff;--mute:#a0b5cd;--line:#30465d}
body[data-theme="sage"]{--bg:#151e19;--panel:#202c24;--ink:#dcece0;--mute:#a4baaa;--line:#394b3e}
body[data-theme="lavender"]{--bg:#1d1928;--panel:#292335;--ink:#eee5ff;--mute:#b9adcc;--line:#453951}
body[data-theme="sand"]{--bg:#242019;--panel:#302a22;--ink:#f3e6d3;--mute:#c0af98;--line:#4d4234}
body:not([data-theme="dark"]):not([data-theme="light"]) #nav{background:var(--panel)}
body:not([data-theme="dark"]) .w:hover,body:not([data-theme="dark"]) button:hover:not(.p):not(.go){background:var(--line)}
.wk i,.bar i{background:var(--ink)}.ringbox svg circle:first-child{stroke:var(--line)}.ringbox svg circle:last-child{stroke:var(--ink)}

[hidden]{display:none!important}.reward-card{display:flex;flex-direction:column;gap:9px}.reward-preview{width:48px;height:48px;border-radius:50%;background:var(--reward);display:block}.reward-preview.ring{padding:4px;position:relative}.reward-preview.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}.reward-frame{background:var(--frame);padding:4px}.reward-card button:disabled{opacity:.5;cursor:default}.reward-frame .profile-avatar{display:block}.reward-frame .profile-placeholder{display:grid}
body[data-theme="dusk"]{--bg:#21191d;--panel:#2d2329;--ink:#f4e1e6;--mute:#c1aab4;--line:#493640}body[data-theme="mint"]{--bg:#10231f;--panel:#19332c;--ink:#dcf4e9;--mute:#a0c6b7;--line:#345348}body[data-theme="ember"]{--bg:#251b17;--panel:#352820;--ink:#f5e3d6;--mute:#c6ae9d;--line:#503c30}

.reward-frame,.reward-preview.ring{overflow:visible;position:relative}.frame-art{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none;z-index:2;overflow:visible}.status-dot{z-index:4}.frame-art .orbit{transform-origin:50% 50%;animation:frameOrbit 12s linear infinite}.frame-art .float{animation:frameFloat 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.frame-art .spark{animation:frameSpark 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.reward-preview.ring .frame-art{z-index:3}.reward-preview.ring{margin:9px}.reward-frame{margin:5px}.claim-overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000b;backdrop-filter:blur(8px);padding:22px}.claim-box{width:min(390px,100%);text-align:center;position:relative;overflow:hidden;padding:32px 22px;animation:claimIn .45s cubic-bezier(.2,.9,.3,1.3)}.claim-box .reward-preview{width:104px;height:104px;margin:26px auto}.claim-box h1{font-weight:600}.claim-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.claim-confetti i{position:absolute;left:50%;top:42%;width:7px;height:12px;border-radius:2px;background:var(--c);animation:confetti 1.5s ease-out both;transform:translate(0,0)}.claim-ready{border-color:#dfb65e}.claim-ready button{background:#dfb65e;color:#17120a;border-color:#dfb65e}.claim-box button{position:relative;width:100%;margin-top:9px}@keyframes frameOrbit{to{transform:rotate(360deg)}}@keyframes frameFloat{50%{transform:translateY(-5px)}}@keyframes frameSpark{50%{opacity:.35;transform:scale(.65)}}@keyframes claimIn{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}@keyframes confetti{0%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}@media(prefers-reduced-motion:reduce){.claim-confetti{display:none}}

  var s=Math.ceil(left/1000),c=document.getElementById("clk");if(c)c.textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2);var p=document.getElementById("pb");if(p)p.style.width=(100-left/(V.tm.len*600))+"%";document.title=c?c.textContent+" Learnspot":"Learnspot"}

function startReview(){var q=due(subj());if(!q.length)return;V.queue=q.map(function(c){return c.id});V.show=false;V.view="review";render()}
function reviewView(){
  var s=subj(),c=s.cards.find(function(x){return x.id===V.queue[0]});
  if(!c){addMin(0);return'<h1>Fertig für heute</h1><p class="mute">Alle fälligen Karten in „'+esc(s.name)+'“ sind erledigt.</p><button class="p big" onclick="go(\'subject\')">Zum Fach</button>'}
  var h='<div class="row sp"><button class="g" onclick="go(\'subject\')">‹ Beenden</button><span class="mute">Noch '+V.queue.length+'</span></div><div class="card q">'+esc(c.q)+(V.show?'<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div style="font-weight:400">'+esc(c.a)+'</div>':'')+'</div>';
  h+=V.show?'<div class="opts"><button onclick="rate(false)">Nochmal</button><button class="p" onclick="rate(true)">Gewusst</button></div>':'<button class="p big" onclick="V.show=true;render()">Antwort zeigen</button>';
  return h;
}
function rate(ok){var s=subj(),id=V.queue.shift(),c=s.cards.find(function(x){return x.id===id}),iv=[1,2,4,8,16,32];
  if(ok){S.rewards.count=(S.rewards.count||0)+1;if(REWARDS.some(function(r){return r[4]===S.rewards.count&&!unlocked(r)}))toast("Neue Belohnung verfügbar! ✦");c.box=Math.min(5,c.box+1);c.due=addDays(iv[c.box])}else{c.box=0;c.due=ymd();V.queue.push(id)}
  V.show=false;save();render()}
var onboardStep=0;
function onboardingView(){
  var z=S.settings, p=S.profile;
  var img=p.image?'<img src="'+p.image+'" alt="Profilbild" class="profile-avatar">':'<div class="profile-avatar profile-placeholder">?</div>';
  function options(values,selected,suffix){return values.map(function(v){return '<option value="'+esc(v)+'"'+(String(v)===String(selected)?' selected':'')+'>'+esc(v)+(suffix||'')+'</option>'}).join('')}
  var titles=['Dein Profil','Deine Schule','Dein Jahrgang','Deine Schulzeit'];
  var h='<div class="onboard"><div class="card onboard-card"><div class="row sp"><span class="mute">Einrichtung</span><span class="mute">'+(onboardStep+1)+' / 4</span></div><div class="onboard-progress">'+titles.map(function(t,i){return '<i class="'+(i<=onboardStep?'active':'')+'"></i>'}).join('')+'</div><h1>'+titles[onboardStep]+'</h1>';
  if(onboardStep===0)h+='<p class="mute">Willkommen bei Learnspot!</p><div class="profile-top"><label class="avatar-pick" for="onboardImage">'+img+'<input id="onboardImage" type="file" accept="image/*" hidden onchange="setOnboardImage(this)"></label><span class="mute">Profilbild auswählen (optional)</span></div><label class="mute" for="onboardName">Nutzername *</label><input id="onboardName" required value="'+esc(p.name||'')+'" placeholder="Dein Name" oninput="S.profile.name=this.value">';
  if(onboardStep===1)h+='<p class="mute">Welche Schule besuchst du?</p><label class="mute" for="obSchool">Schulform</label><select id="obSchool" onchange="S.settings.schoolType=this.value">'+options(['Gymnasium','Gesamtschule','Berufliches Gymnasium','Gemeinschaftsschule','Andere'],z.schoolType)+'</select><label class="mute" for="obSchoolName" style="display:block;margin-top:12px">Schulname (optional)</label><input id="obSchoolName" value="'+esc(z.schoolName||'')+'" oninput="S.settings.schoolName=this.value" placeholder="Name deiner Schule">';
  if(onboardStep===2)h+='<p class="mute">In welchem Jahrgang bist du?</p><select aria-label="Jahrgang" onchange="S.settings.grade=this.value">'+options(Array.from({length:13},function(_,i){return i+1}),z.grade,'. Klasse')+'</select><label class="upper-toggle"><span>Ich bin in der Oberstufe</span><input type="checkbox" '+(z.upper?'checked':'')+' onchange="S.settings.upper=this.checked"></label>';
  if(onboardStep===3)h+='<p class="mute">Wie viele Jahre dauert deine Schulzeit insgesamt?</p><select aria-label="Schulzeit" onchange="S.settings.schoolYears=this.value">'+options([9,10,11,12,13],z.schoolYears,' Jahre')+'</select>';
  h+='<div class="onboard-nav"><button type="button" aria-label="Zurück" '+(onboardStep===0?'disabled':'')+' onclick="moveOnboarding(-1)">←</button><button type="button" class="p" onclick="moveOnboarding(1)">'+(onboardStep===3?'Los geht’s':'Weiter →')+'</button></div></div></div>';return h;
}
function requireName(id){var e=document.getElementById(id);if(e&&!e.value.trim()){e.setCustomValidity("Bitte gib deinen Namen ein.");e.reportValidity();e.focus();return false}return true}
document.addEventListener("input",function(e){if(e.target.setCustomValidity)e.target.setCustomValidity("")});
function moveOnboarding(d){if(d>0&&onboardStep===0&&!requireName("onboardName"))return;if(d>0&&onboardStep===3){finishOnboarding();return}onboardStep=Math.max(0,Math.min(3,onboardStep+d));render()}
function setOnboardImage(input){if(!input.files||!input.files[0])return;readImg(input.files[0]).then(function(data){S.profile.image=data;if(!S.onboarded&&onboardStep===0)render();else if(S.onboarded)save()})}
function finishOnboarding(){if(!(S.profile.name||"").trim()){onboardStep=0;render();requireName("onboardName");return}S.profile.name=(S.profile.name||'').trim();S.settings.displayName=S.profile.name;S.settings.schoolName=(S.settings.schoolName||'').trim();S.onboarded=true;save();V.view='home';render()}
document.addEventListener('keydown',function(e){if(!accountReady||S.onboarded||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,select,textarea,button,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveOnboarding(e.key==='ArrowLeft'?-1:1)}});

var artSerial=0;
var client=null, authMode='login', syncTimer=null, syncChain=Promise.resolve(), dirty=false, accountBusy=false;
function freshState(){return {subjects:[],log:{},goal:30,settings:{theme:'dark',schoolType:'Gymnasium',grade:'11',upper:false,schoolYears:'13',schoolName:''},globalNotes:[],globalLinks:[],profile:{name:'',bio:'',image:'',frame:'none',status:'online'},friends:[],onboarded:false,rewards:{count:0,admin:false,claimed:[]},removedEmptyMatheGK:true};}
function syncMessage(t){var e=document.getElementById('syncStatus');if(e)e.textContent=t;}
function queueSync(){dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,500);syncMessage('Änderungen werden gespeichert …');}
function flushSync(){clearTimeout(syncTimer);if(!dirty||!accountReady||!accountUser)return syncChain;var id=accountUser.id, data=JSON.parse(JSON.stringify(S));dirty=false;syncChain=syncChain.then(async()=>{try{var r=await client.from('learnspot_state').upsert({user_id:id,data:data});if(r.error)throw r.error;syncMessage('Synchronisiert');}catch(e){dirty=true;syncMessage('Nicht synchronisiert – bitte erneut online versuchen.');console.warn(e);}});return syncChain;}
function authView(message){document.getElementById('nav').style.display='none';document.getElementById('app').innerHTML='<div class="onboard"><div class="card onboard-card auth-card"><h1>Learnspot</h1><p class="mute">Dein persönlicher Lernspace.</p><h2>'+(authMode==='login'?'Anmelden':'Konto erstellen')+'</h2><form onsubmit="event.preventDefault();submitAccount()"><label>E-Mail-Adresse</label><input id="authEmail" type="email" required autocomplete="email" placeholder="name@beispiel.de"><label>Passwort</label><input id="authPassword" type="password" required '+(authMode==='register'?'minlength="8"':'')+' autocomplete="'+(authMode==='login'?'current-password':'new-password')+'" placeholder="Mindestens 8 Zeichen"><button class="p big" '+(accountBusy?'disabled':'')+'>'+(authMode==='login'?'Anmelden':'Registrieren')+'</button></form><p class="mute" role="status" id="authMessage">'+esc(message||(!client?'Online-Konten sind noch nicht eingerichtet.':' '))+'</p><button onclick="authMode=authMode===&quot;login&quot;?&quot;register&quot;:&quot;login&quot;;authView()">'+(authMode==='login'?'Noch kein Konto? Registrieren':'Schon ein Konto? Anmelden')+'</button></div></div>';}
async function enterAccount(user){if(accountReady&&accountUser?.id===user.id)return;var r=await client.from('learnspot_state').select('data').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;S=r.data?.data||freshState();delete S.friends;accountUser=user;accountReady=true;V.view='home';onboardStep=0;document.getElementById('nav').style.display='';render();if(!r.data)save();}
async function submitAccount(){if(accountBusy)return;var msg=document.getElementById('authMessage');if(!client){msg.textContent='Keine Verbindung zu Supabase. Bitte Seite neu laden und Internet prüfen.';return;}var email=val('authEmail').trim(),password=val('authPassword');accountBusy=true;var btn=document.querySelector('.auth-card form button');btn.disabled=true;msg.textContent='Verbindung wird aufgebaut …';try{var r=authMode==='login'?await client.auth.signInWithPassword({email,password}):await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;if(r.data.session)await enterAccount(r.data.user);else{authMode='login';authView('Bitte bestätige deine E-Mail-Adresse und melde dich anschließend an.');}}catch(e){authView('Anmeldung fehlgeschlagen: '+e.message);document.getElementById('authEmail').value=email;}finally{accountBusy=false;if(!accountReady){var b=document.querySelector('.auth-card form button');if(b)b.disabled=false;}}}
async function signOutAccount(){await flushSync();if(dirty){alert('Nicht alle Änderungen sind online gespeichert. Bitte versuche es erneut.');return;}var r=await client.auth.signOut();if(r.error){alert(r.error.message);return;}accountReady=false;accountUser=null;S=freshState();authView();}
async function initAccount(){try{if(!window.supabase||!window.LEARNSPOT_CONFIG||!LEARNSPOT_CONFIG.url||!LEARNSPOT_CONFIG.key){authView('Supabase muss zuerst eingerichtet werden.');return;}client=supabase.createClient(LEARNSPOT_CONFIG.url,LEARNSPOT_CONFIG.key,{global:{fetch:(url,options)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),20000);if(options?.signal){if(options.signal.aborted)c.abort();else options.signal.addEventListener('abort',()=>c.abort(),{once:true});}return fetch(url,{...options,signal:c.signal}).finally(()=>clearTimeout(t));}}});var r=await client.auth.getSession();if(r.error)throw r.error;if(r.data.session)await enterAccount(r.data.session.user);else authView();}catch(e){authView('Verbindung fehlgeschlagen: '+e.message);}}
window.addEventListener('online',()=>{if(accountReady)flushSync();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&accountReady)flushSync();});matchMedia('(max-width:899px)').addEventListener('change',()=>{if(accountReady&&S.onboarded)render();});initAccount();
</script>
