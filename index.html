<style>
:root{--bg:#000;--panel:#0a0a0a;--ink:#f4f4f2;--mute:#8a8a8a;--line:#1f1f1f;--warm:#ffd166;--bad:#ff8a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;transition:background .2s,color .2s}
body[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--ink:#17191c;--mute:#68707a;--line:#dfe3e8;color-scheme:light}
body[data-theme="light"] #nav{background:rgba(255,255,255,.94)}
body[data-theme="light"] #nav button.on{color:#fff;background:#17191c}
body[data-theme="light"] .ringbox svg circle:first-child{stroke:#dfe3e8}
body[data-theme="light"] .bar{background:#dfe3e8}
body[data-theme="light"] .w.go,body[data-theme="light"] button.p{background:#17191c;color:#fff;border-color:#17191c}
body[data-theme="light"] .tabs button.on,body[data-theme="light"] .opts button.on{background:#17191c;color:#fff;border-color:#17191c}
body[data-theme="light"] .wk i{background:#17191c}
body[data-theme="light"] .ringbox svg circle:last-child{stroke:#17191c}
body[data-theme="light"] a{color:#2458a6!important}
main{max-width:720px;margin:0 auto;padding:24px 16px 110px}
h1,h2,h3{margin:0;line-height:1.1;font-weight:300}
h1{font-size:2.2rem}
h2{font-size:1.2rem;font-weight:600;margin:30px 0 12px}
.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #2a2a2a;background:var(--panel);border-radius:14px;padding:10px 14px;font-weight:600;transition:background .15s,transform .15s}
button:hover{background:#151515}
button.p{background:var(--ink);color:#000;border-color:var(--ink)}
button.p:hover{background:#fff}
button.big{width:100%;padding:18px;font-size:1.15rem;border-radius:20px}
button.g{border:none;background:none;color:var(--mute);padding:6px 8px}
button.g:hover{color:var(--ink);background:none}
:is(button,input,textarea,select,a):focus-visible{outline:2px solid #fff;outline-offset:3px}
input,textarea,select{width:100%;background:var(--panel);border:1px solid #2a2a2a;border-radius:14px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.wm{font-size:1.4rem;font-weight:300}.wm b{font-weight:800}
.ic{width:24px;height:24px;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.span2{grid-column:span 2}
.w{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;text-align:left;transition:transform .2s ease,border-color .2s,background .2s}
.w:hover,.w:focus-visible{transform:scale(1.04);border-color:#4a4a4a;background:#121212}
button.w{display:block;width:100%;font-weight:400}
.go{background:var(--ink);color:#000;display:flex!important;align-items:center;gap:14px;font-size:1.3rem;font-weight:600!important;border-color:var(--ink)}
.go:hover{background:#fff}
.num{font-size:2.8rem;font-weight:300;line-height:1;margin-top:10px;display:block}
.ringbox{position:relative;width:92px;height:92px;margin-top:6px}
.ringbox svg{transform:rotate(-90deg)}
.ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600}
.wk{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:10px}
.wk div{flex:1;text-align:center;font-size:.75rem;color:var(--mute)}
.wk i{display:block;background:#fff;border-radius:6px;margin-bottom:4px}
.fach{display:flex!important;flex-direction:column;align-items:flex-start;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.badge{background:var(--warm);color:#1b1300;border-radius:20px;padding:1px 10px;font-size:.8rem;font-weight:700}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1}
.tabs button.on,.opts button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.note{margin-bottom:10px}
.note img{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.note p{white-space:pre-wrap;margin:6px 0 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{height:64px;border-radius:8px}
.timer{font-size:5.5rem;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:20px 0}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
.opts{display:flex;gap:8px}.opts button{flex:1}
.q{font-size:1.4rem;font-weight:500;text-align:center;padding:28px 10px}
#nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#nav .wm{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:var(--mute);padding:6px;border-radius:14px;font-size:.75rem}
#nav button:hover{transform:scale(1.12);color:var(--ink);background:none}
#nav button.on{color:#000;background:var(--ink)}
@media(min-width:900px){
#nav{top:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:none;border-right:1px solid var(--line);padding:calc(28px + env(safe-area-inset-top,0px)) 14px 24px}
#nav .wm{display:block;margin:0 10px 28px;font-size:1.6rem}
#nav button{flex:none;flex-direction:row;gap:12px;font-size:1rem;padding:12px 14px;justify-content:flex-start}
main{margin:0 0 0 220px;max-width:none;width:calc(100% - 220px);min-width:0;padding:36px clamp(24px,3vw,56px) 60px;box-sizing:border-box}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(3deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,209,102,.3))}50%{filter:drop-shadow(0 0 10px rgba(255,209,102,.9))}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.fl{position:relative;display:inline-block;color:var(--mute)}
.sk:not(.on) .fl{animation:pulse 2.4s ease-in-out infinite}
.sk.on .fl{color:var(--warm);animation:flick 1.6s ease-in-out infinite,glow 2.4s ease-in-out infinite}
.sk i{position:absolute;left:50%;top:2px;width:4px;height:4px;border-radius:50%;background:var(--warm);opacity:0}
.sk.on i{animation:rise 2s ease-out infinite}
.sk.on i:nth-child(2){margin-left:-9px;animation-delay:.7s}
.sk.on i:nth-child(3){margin-left:7px;animation-delay:1.3s}
.wk i{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.wk div:nth-child(2) i{animation-delay:.05s}.wk div:nth-child(3) i{animation-delay:.1s}.wk div:nth-child(4) i{animation-delay:.15s}.wk div:nth-child(5) i{animation-delay:.2s}.wk div:nth-child(6) i{animation-delay:.25s}.wk div:nth-child(7) i{animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Auswahlfelder: ohne dekorativen Pfeil, Auswahl öffnet sich beim Antippen */
select{appearance:none;-webkit-appearance:none;color:var(--ink)!important;background-color:var(--panel)!important;border-color:var(--line);background-image:none!important;padding-right:12px;cursor:pointer}
select option{background:var(--panel);color:var(--ink)}

.map-pin:hover{transform:translate(-50%,-50%) scale(1.3)}.map-pin.active{box-shadow:0 0 0 5px rgba(150,165,190,.2),0 2px 7px rgba(0,0,0,.38)}.map-pin.link-start{box-shadow:0 0 0 5px rgba(101,214,189,.24),0 2px 7px rgba(0,0,0,.38)}
.map-hint{position:absolute;left:14px;right:14px;bottom:12px;z-index:4;pointer-events:none;font-size:.8rem;color:#aeb7c4;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.map-editor{display:grid;gap:8px}.map-detail{margin-top:12px}.map-detail p{white-space:pre-wrap;margin:8px 0}.map-tools{display:flex;gap:8px;flex-wrap:wrap}.map-tools button{flex:1}
.map-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.map-toolbar button{flex:1}.map-toolbar button.on{background:var(--ink);color:var(--bg)}
.map-colors{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.map-color{width:25px;height:25px;min-width:25px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.65);box-shadow:0 1px 5px rgba(0,0,0,.3)}.map-color.chosen{outline:2px solid var(--ink);outline-offset:3px}
.map-links-list{display:grid;gap:7px;margin-top:10px}.map-link-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:.9rem}.map-link-row button{padding:5px 9px;font-size:.82rem}
.map-zoom{position:absolute;z-index:5;right:12px;top:12px;display:flex;gap:6px}.map-zoom button{width:36px;height:36px;padding:0;border-radius:11px;background:rgba(20,20,20,.9);border-color:#333;font-size:1.15rem}.map-stage .map-hint{color:#8d8d8d;text-shadow:none}body[data-theme="light"] .map-stage{background:#050505;border-color:#242424}body[data-theme="light"] .map-hint{color:#8d8d8d}
#nav button span{transition:transform .16s ease,opacity .16s ease}#nav button:hover span{transform:translateY(-2px);opacity:1}




.profile-head{margin-top:16px}.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:18px}.profile-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}.profile-placeholder{display:grid;place-items:center;background:#202329;color:#fff;font-size:2rem;font-weight:600}.friend-list{display:grid;gap:6px;margin-top:12px}.friend-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

.avatar-pick{position:relative;display:inline-block;cursor:pointer;border-radius:50%}
.avatar-pick .profile-avatar{transition:transform .16s ease,box-shadow .16s ease}
.avatar-pick:hover .profile-avatar{transform:scale(1.04);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.status-dot{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:50%;border:3px solid var(--panel);display:grid;place-items:center}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#6b7280}
.status-dot.abwesend{background:#ef4444}
.status-dot.abwesend span{display:block;width:8px;height:2px;border-radius:2px;background:#fff}
.status-opts{display:flex;gap:8px}
.status-opt{flex:1;padding:10px 8px;border-radius:14px;font-weight:600}
.status-opt.on{background:var(--ink);color:#000;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:80;background:var(--ink);color:#000;padding:10px 16px;border-radius:16px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.toast{bottom:28px}}
.onboard{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px)}
.onboard-card{width:min(430px,100%);padding:24px}
.onboard-card h1{font-size:1.7rem}
.upper-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer}.upper-toggle input{appearance:none;-webkit-appearance:none;position:relative;width:44px;height:26px;flex:none;border:1px solid var(--line);border-radius:30px;background:#555;padding:0;margin:0;cursor:pointer;transition:background .2s}.upper-toggle input:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s}.upper-toggle input:checked{background:#22a65a}.upper-toggle input:checked:before{transform:translateX(18px)}
.onboard-progress{display:flex;gap:6px;margin:14px 0 24px}.onboard-progress i{height:4px;flex:1;background:var(--line);border-radius:9px}.onboard-progress i.active{background:var(--ink)}.onboard-nav{display:flex;gap:10px;margin-top:24px}.onboard-nav button:first-child{width:52px}.onboard-nav button:last-child{flex:1}.onboard-nav button:disabled{opacity:.25;cursor:default}.onboard-card{max-height:90vh;overflow:auto}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.theme-choice{display:flex;align-items:center;gap:9px;text-align:left;border-color:var(--line);font-weight:500;min-width:0}.theme-choice.chosen{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.theme-swatch{width:22px;height:22px;border-radius:50%;border:1px solid #8886;flex:none}.theme-check{margin-left:auto}.theme-choice:hover{background:var(--line)}
body[data-theme="ocean"]{--bg:#101b28;--panel:#172637;--ink:#dbeaff;--mute:#a0b5cd;--line:#30465d}
body[data-theme="sage"]{--bg:#151e19;--panel:#202c24;--ink:#dcece0;--mute:#a4baaa;--line:#394b3e}

body[data-theme="sand"]{--bg:#242019;--panel:#302a22;--ink:#f3e6d3;--mute:#c0af98;--line:#4d4234}
body:not([data-theme="dark"]):not([data-theme="light"]) #nav{background:var(--panel)}
body:not([data-theme="dark"]) .w:hover,body:not([data-theme="dark"]) button:hover:not(.p):not(.go){background:var(--line)}
.wk i,.bar i{background:var(--ink)}.ringbox svg circle:first-child{stroke:var(--line)}.ringbox svg circle:last-child{stroke:var(--ink)}

[hidden]{display:none!important}.reward-card{display:flex;flex-direction:column;gap:9px}.reward-preview{width:48px;height:48px;border-radius:50%;background:var(--reward);display:block}.reward-preview.ring{padding:4px;position:relative}.reward-preview.ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}.reward-frame{background:var(--frame);padding:4px}.reward-card button:disabled{opacity:.5;cursor:default}.reward-frame .profile-avatar{display:block}.reward-frame .profile-placeholder{display:grid}
body[data-theme="dusk"]{--bg:#21191d;--panel:#2d2329;--ink:#f4e1e6;--mute:#c1aab4;--line:#493640}body[data-theme="mint"]{--bg:#10231f;--panel:#19332c;--ink:#dcf4e9;--mute:#a0c6b7;--line:#345348}body[data-theme="ember"]{--bg:#251b17;--panel:#352820;--ink:#f5e3d6;--mute:#c6ae9d;--line:#503c30}

<script>
var COL=["#0f766e","#e8890c","#6d5bd0","#c2410c","#2563eb","#be185d"];
function ymd(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{var s=JSON.parse(localStorage.getItem("lernhafen"));if(s&&s.subjects)return s}catch(e){}return{subjects:[],log:{},goal:30,settings:{theme:"dark",schoolType:"Gymnasium",grade:"11",upper:true,schoolYears:"13",schoolName:""}}}
var accountReady=false, accountUser=null; var S=load();
S.settings=S.settings||{theme:"dark",schoolType:"Gymnasium",grade:"11",upper:true,schoolYears:"13",schoolName:"",displayName:""};
S.subjects.forEach(function(x){if(!x.level)x.level="GK"});
if(!S.removedEmptyMatheGK){S.subjects=S.subjects.filter(function(x){return !(/^(mathe|mathematik)(\s+gk)?$/i.test(x.name.trim())&&x.level==="GK"&&!(x.notes||[]).length&&!(x.cards||[]).length)});S.removedEmptyMatheGK=true;save();}
S.globalNotes=S.globalNotes||[];S.globalLinks=S.globalLinks||[];S.profile=S.profile||{name:S.settings.displayName||"",bio:"",image:""};S.friends=S.friends||[];delete S.settings.spotifyEmbed;
S.onboarded=!!S.onboarded; S.rewards=S.rewards||{count:0,admin:false}; S.profile.frame=S.profile.frame||"none"; S.rewards.claimed=S.rewards.claimed||REWARDS_LEGACY();
['pet','starterPet','petXP','petCustom','petUntil'].forEach(function(k){delete S.profile[k]}); S.rewards.claimed=S.rewards.claimed.filter(function(id){return !['cat','dog','blob','ufo','ghost','mochi'].includes(id)}); save(); S.profile.status=S.profile.status||"online";
if(S.profile.status!=="offline"&&S.profile.status!=="abwesend")S.profile.status="online";
function applyTheme(){var t=S.settings.theme||"dark";if(t==="system")t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.body.setAttribute("data-theme",t)}
function save(){if(accountReady&&accountUser){try{localStorage.setItem("learnspot-account-"+accountUser.id,JSON.stringify(S));}catch(e){} queueSync();}}
var V={view:"home",sid:null,tab:"notes",tm:null,card:null,show:false,dur:25,pend:[],docs:[],filter:"all",selectedGlobal:null,mapDraft:null,connectMode:false,linkStart:null,panX:0,panY:0,mapZoom:1,panDrag:null};
function subj(){return S.subjects.find(function(s){return s.id===V.sid})}
function due(s){var t=ymd();return s.cards.filter(function(c){return c.due<=t})}
function totalSeconds(d){d=d||ymd();return Math.round(((S.log||{})[d]||0)*60)+((S.practiceSeconds||{})[d]||0)}
function minutes(d){return totalSeconds(d)/60}
function timeLabel(n){n=Math.max(0,Math.floor(n));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
var reviewClock=null;
function reviewTrack(){if(!reviewClock||!accountReady)return;var now=Date.now();if(reviewClock.running){var elapsed=Math.max(0,Math.floor((now-reviewClock.last)/1000));if(elapsed){reviewClock.last+=elapsed*1000;reviewClock.seconds+=elapsed;S.practiceSeconds=S.practiceSeconds||{};var d=ymd();S.practiceSeconds[d]=(S.practiceSeconds[d]||0)+elapsed;save();}}var e=document.getElementById('reviewTime');if(e)e.textContent=Math.floor(reviewClock.seconds/60)+':'+String(reviewClock.seconds%60).padStart(2,'0');var g=document.getElementById('reviewGoal');if(g)g.textContent=timeLabel(totalSeconds())+' / '+S.goal+':00 Min. Tagesziel';}
function reviewStop(){reviewTrack();if(reviewClock)reviewClock.running=false;}
setInterval(function(){if(reviewClock&&reviewClock.running){if(V.view!=='review'||!accountReady){reviewStop();return}reviewTrack()}},1000);
document.addEventListener('visibilitychange',function(){if(!reviewClock||V.view!=='review'||!V.queue.length)return;if(document.hidden)reviewStop();else{reviewClock.last=Date.now();reviewClock.running=true}});
function reviewProgress(){var total=reviewClock?reviewClock.total:0,done=Math.max(0,total-V.queue.length),pct=total?Math.round(done/total*100):0;return '<div class="card" style="margin:12px 0"><div class="row sp"><b>'+done+' / '+total+' Karten geschafft</b><b>'+pct+' %</b></div><div class="bar" style="margin:10px 0"><i style="width:'+pct+'%;transition:width .3s"></i></div><div class="row sp"><span class="mute">Lernzeit <b id="reviewTime">'+Math.floor((reviewClock?.seconds||0)/60)+':'+String((reviewClock?.seconds||0)%60).padStart(2,'0')+'</b></span><span class="mute" id="reviewGoal">'+timeLabel(totalSeconds())+' / '+S.goal+':00 Min. Tagesziel</span></div></div>'}
function streak(){var n=0,i=0;if(minutes()<10)i=1;for(;;i++){if(minutes(addDays(-i))>=10)n++;else break}return n}
function addMin(m){petGain(Math.floor(m)*2);S.log[ymd()]=(S.log[ymd()]||0)+m;save()}

function normalizeSchool(z){var years=Math.max(9,Math.min(13,parseInt(z.schoolYears,10)||13));var grade=Math.max(1,Math.min(years,parseInt(z.grade,10)||1));z.schoolYears=String(years);z.grade=String(grade);z.upper=grade>=9&&!!z.upper;return z;}
function schoolRules(){var grade=document.querySelector('#grade,select[aria-label="Jahrgang"]'),years=document.querySelector('#schoolYears,select[aria-label="Schulzeit"]'),upper=document.querySelector('.upper-toggle input');var max=Number(years?years.value:S.settings.schoolYears)||13;var n=Math.min(Number(grade?grade.value:S.settings.grade)||1,max);if(grade){grade.value=String(n);Array.from(grade.options).forEach(o=>o.disabled=Number(o.value)>max);var grid=grade.nextElementSibling;if(grid?.classList.contains('school-choices'))Array.from(grid.children).forEach((b,i)=>{b.disabled=grade.options[i].disabled;b.setAttribute('aria-pressed',String(grade.options[i].selected));});}if(upper){upper.disabled=n<9;if(upper.disabled)upper.checked=false;upper.closest('label').style.opacity=upper.disabled?'.5':'';upper.closest('label').title=upper.disabled?'Ab Klasse 9 verfügbar':'';}if(!S.onboarded){S.settings.grade=String(n);if(n<9)S.settings.upper=false;}}
function schoolChoices(){document.querySelectorAll('#schoolType,#grade,#schoolYears,#obSchool,select[aria-label="Jahrgang"],select[aria-label="Schulzeit"]').forEach(function(sel){var grid=document.createElement('div');grid.className='school-choices'+(sel.options.length>=13?' numeric':'')+(sel.options.length===5&&Array.from(sel.options).every(function(o){return /^\d+$/.test(o.value)})?' numeric':'');grid.setAttribute('role','group');grid.setAttribute('aria-label',sel.getAttribute('aria-label')||({schoolType:'Schulform',grade:'Klasse',schoolYears:'Schulzeit',obSchool:'Schulform'}[sel.id]));Array.from(sel.options).forEach(function(o){var b=document.createElement('button');b.type='button';b.textContent=grid.classList.contains('numeric')?o.value:o.textContent;b.setAttribute('aria-label',o.textContent);b.setAttribute('aria-pressed',String(o.selected));b.onclick=function(){sel.value=o.value;sel.dispatchEvent(new Event('change',{bubbles:true}));Array.from(grid.children).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});schoolRules()};grid.appendChild(b)});sel.hidden=true;sel.style.display='none';sel.after(grid)});schoolRules()}
function render(){
  if(!accountReady){authView();return;} normalizeSchool(S.settings); if(!S.settings.upper)V.filter="all"; if(innerWidth<900&&V.view==="map")V.view="home";
  var a=document.getElementById("app");
  if(!S.onboarded){a.innerHTML=onboardingView();applyTheme();schoolChoices();return}
  if(V.view==="home")a.innerHTML=home();
  else if(V.view==="pets")a.innerHTML=petPage();
  else if(V.view==="calendar")a.innerHTML=calendarPage();
  else if(V.view==="subject")a.innerHTML=subjectView();
  else if(V.view==="subjects")a.innerHTML=subjectsView();
  else if(V.view==="focus")a.innerHTML=focusView();
  else if(V.view==="review")a.innerHTML=reviewView();
  else if(V.view==="practice")a.innerHTML=practiceView();
  else if(V.view==="rewards")a.innerHTML=rewardsView(false);
  else if(V.view==="customize")a.innerHTML=rewardsView(true);
  else if(V.view==="settings")a.innerHTML=settingsView();
  else if(V.view==="map")a.innerHTML=mapView();
  else if(V.view==="friends")a.innerHTML=socialView();
  else if(V.view==="ai")a.innerHTML=aiView();
  else if(V.view==="profile")a.innerHTML=profileView()+equippedProfile();
  if(V.view==='friends')loadSocial(); if(V.view==='profile'||V.view==='home'){a.insertAdjacentHTML('beforeend','<div class="card row" style="margin-top:16px;flex-wrap:wrap"><button onclick="go(&quot;friends&quot;)">Freunde & Chat</button></div>'.replace(/onclick="go\(friends\)"/g,''));} applyTheme();navr();if(V.view==="settings"){var st=document.getElementById("schoolType");if(st)st.value=S.settings.schoolType||"Gymnasium"}schoolChoices();if(!S.settings.upper){a.querySelectorAll(".course-level,#nlevel").forEach(e=>e.remove());a.querySelectorAll("label").forEach(e=>{if(e.textContent==="Kursart")e.parentElement.remove()});if(V.view==="subjects")a.querySelector(".tabs")?.remove();a.querySelectorAll(".fach-lk,.fach-gk").forEach(e=>e.classList.remove("fach-lk","fach-gk"));}window.scrollTo(0,0);
}
function go(v,id){if(V.view==="review"&&v!=="review")reviewStop();V.view=v;if(id)V.sid=id;V.tab="notes";V.pend=[];V.docs=[];render()}

function ic(n){var p={paw:'<ellipse cx="5" cy="8" rx="2" ry="3"/><ellipse cx="10" cy="5" rx="2" ry="3"/><ellipse cx="15" cy="5" rx="2" ry="3"/><ellipse cx="20" cy="8" rx="2" ry="3"/><path d="M5 18c0-4 4-7 7-7s7 3 7 7c0 5-5 2-7 2s-7 3-7-2z"/>',friends:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 6"/>',send:'<path d="M22 2 7 17M22 2 15 22 7 17 2 9z"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',folder:'<path d="M3 6h6l2 2h10v13H3z"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',cards:'<rect x="3" y="7" width="13" height="13" rx="2"/><path d="M8 3h13v13"/>',flame:'<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 1 1 2 2 2 1-2 1-5 1-8z"/>',plus:'<path d="M12 5v14M5 12h14"/>',map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',settings:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h12M20 17h0"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="17" r="2"/>',profile:'<circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>',external:'<path d="M14 3h7v7M10 14 21 3M18 13v7H4V6h7"/>'};return'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p[n]+'</svg>'}
function countUp(){var e=document.querySelector("[data-n]");if(!e||matchMedia("(prefers-reduced-motion:reduce)").matches)return;var n=+e.dataset.n,t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function menuItems(){return [["home","Heute","home"],["subjects","Fächer","folder"],["review","Üben","cards"],["focus","Fokus","timer"],["friends","Freunde","friends"],["calendar","Kalender","flame"],["pets","Pets","paw"],["map","Notiz-Map","map"],["settings","Einstellungen","settings"],["profile","Profil","profile"]].filter(x=>innerWidth>=900||x[0]!=="map")}
function menuSelection(){let k=innerWidth<900?'menuMobile':'menuDesktop';return S.settings[k]|| (k==='menuMobile'?['home','subjects','review']:['home','subjects','review','focus','friends','calendar','map']);}
function navr(){countUp();let active=V.view==='practice'||V.view==='rewards'?'review':V.view==='customize'?'profile':V.view==='subject'?'subjects':V.view;let items=menuItems(),sel=menuSelection(),max=innerWidth<900?3:8;let chosen=items.filter(x=>x[0]!=='profile'&&sel.includes(x[0])).slice(0,max);chosen.push(items.find(x=>x[0]==='profile'));document.getElementById('nav').innerHTML='<div class="wm">learn<b>spot</b></div>'+chosen.map(x=>`<button class="${active===x[0]?'on':''}" onclick="nav('${x[0]}')" aria-label="${x[1]}">${ic(x[2])}<span>${x[1]}</span></button>`).join('')+'<button class="menu-plus" onclick="menuEdit()" aria-label="Menü anpassen">'+ic('plus')+'<span>Mehr</span></button>'}
function menuEdit(){let d=document.createElement('dialog');d.className='menu45';let mobile=innerWidth<900,max=mobile?3:8,k=mobile?'menuMobile':'menuDesktop';let selected=menuSelection().filter(x=>x!=='profile');let items=menuItems().filter(x=>x[0]!=='profile');function draw(){d.innerHTML='<div class="row sp"><h2>Dein Menü</h2><button class="menu-close" aria-label="Schließen">×</button></div><p class="mute">Wähle bis zu '+max+' Bereiche für deine Navigation. Alle Bereiche bleiben hier erreichbar.</p>'+items.map(x=>`<div class="menu45row"><button data-go="${x[0]}">${ic(x[2])}<span>${x[1]}</span></button><button class="menu-toggle" data-toggle="${x[0]}" aria-label="${selected.includes(x[0])?'Entfernen':'Hinzufügen'} ${x[1]}" aria-pressed="${selected.includes(x[0])}" ${!selected.includes(x[0])&&selected.length>=max?'disabled':''}>${selected.includes(x[0])?'−':'+'}</button></div>`).join('')+'<button class="p big menu-done">Fertig</button>';d.querySelector('.menu-close').onclick=d.querySelector('.menu-done').onclick=()=>d.close();d.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggle;if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<max)selected.push(id);S.settings[k]=selected.slice();save();navr();draw()});d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{d.close();nav(b.dataset.go)})}draw();document.body.append(d);d.onclose=()=>d.remove();d.showModal()}
function equippedProfile(){let p=petData(),a=PETS.find(x=>x[0]===p.active);return '<div class="card profile-pet45"><div><p class="mute">Ausgerüstetes Pet</p><h2>'+ (a?a[1]:'Noch kein Pet')+'</h2>'+(a?cleanXP(a[0]):'')+'<button onclick="go(&quot;pets&quot;)">Meine Pets</button></div>'+(a?petArt42(a[0],petLevel(a[0])):'')+'</div>'}

function nav(v){if(V.tm){if(!confirm("Runde abbrechen? Es werden keine Minuten gezählt."))return;stopTimer()}if(v==="focus")startFocus();else if(v==="review")go("practice");else go(v)}
function startReviewAny(){var s=S.subjects.find(function(x){return due(x).length});if(!s){go("practice");return}V.sid=s.id;startReview()}
function repeatPicker(){return S.subjects.filter(function(s){return s.cards.length}).map(function(s){return '<button class="w" style="margin-top:8px" onclick="repeatSubject(\''+s.id+'\')"><b>'+esc(s.name)+'</b><span class="mute">'+s.cards.length+' Karten wiederholen</span></button>'}).join("")||'<p class="mute">Erstelle zuerst Karteikarten in einem Fach.</p>'}
function repeatSubject(id){V.sid=id;startReview(true)}
function totalDue(){return S.subjects.reduce(function(n,s){return n+due(s).length},0)}
function courseOrder(items){return !S.settings.upper?items.slice():items.slice().sort(function(a,b){return Number(b.level==='LK')-Number(a.level==='LK')})}
function tile(s){var d=due(s).length;return'<button class="w fach '+(s.level==='LK'?'fach-lk':'fach-gk')+'" onclick="go(\'subject\',\''+s.id+'\')"><span class="row sp" style="width:100%"><span class="dot" style="background:'+s.color+'"></span><span class="badge course-level '+(s.level==='LK'?'level-lk':'level-gk')+'">'+esc(s.level||"GK")+'</span></span><b>'+esc(s.name)+'</b><span class="mute">'+s.notes.length+' Materialien, '+s.cards.length+' Karten</span>'+(d?'<span class="badge">'+d+' fällig</span>':'')+'</button>'}
function home(){
  var m=minutes(),g=S.goal||30,td=totalDue(),hr=new Date().getHours();

async function shareMaterial(id){let n=subj().notes.find(x=>x.id===id);if(!n)return;let material={t:n.t,txt:n.txt,imgs:n.imgs||[]};let d=document.createElement('dialog');d.className='social-dialog';d.innerHTML='<h2>Material senden</h2><p>Wähle einen privaten Chat oder eine Gruppe.</p>';let close=document.createElement('button');close.textContent='Abbrechen';close.onclick=()=>d.close();d.append(close);document.body.append(d);d.onclose=()=>d.remove();d.showModal();try{let friends=(await socialCall('ls_friends')).filter(r=>r.accepted);let groups=[];try{groups=await socialCall('ls_group_list')}catch(e){}for(let x of [...friends.map(r=>({id:r.peer,name:r.peer,group:false})),...groups.map(g=>({...g,group:true}))]){let b=document.createElement('button');b.textContent=(x.group?'Gruppe · ':'Privat · ')+x.name;b.onclick=async()=>{b.disabled=true;try{await socialCall(x.group?'ls_group_send':'ls_send',{...(x.group?{gid:x.id}:{peer:x.id}),body:'Material: '+(material.t||''),material});d.close();alert('Material gesendet')}catch(e){alert(e.message);b.disabled=false}};d.insertBefore(b,close)}if(!friends.length&&!groups.length){let p=document.createElement('p');p.textContent='Noch keine Chats vorhanden.';d.prepend(p)}}catch(e){alert(e.message)}}

function bestStreak(){let best=0,n=0,last=null;let days=[...new Set([...Object.keys(S.log||{}),...Object.keys(S.practiceSeconds||{})])].sort();for(let d of days){if(minutes(d)<10)continue;let t=new Date(d+'T12:00:00Z').getTime();n=last!==null&&t-last===86400000?n+1:1;last=t;best=Math.max(best,n)}return best}

function claimPet(id){let r=PETS.find(x=>x[0]===id),p=petData();if(!r||!petEligible(r)||!p.starter)return;if(!p.unlocked.includes(id))p.unlocked.push(id);save();render()}
function equipPet(id){let p=petData();if(p.unlocked.includes(id)){p.active=id;save();render()}}
function petPageOld(){let p=petData();return '<h1>Pets</h1><p class="mute">10 XP pro richtiger fälliger Karte · 2 XP pro Fokusminute · 100 XP pro Level</p>'+(!p.starter?starterChoices():'<div class="pet42grid">'+PETS.filter(x=>x[2]||x[0]===p.starter).map(x=>'<div class="card">'+petArt42(x[0],petLevel(x[0]))+'<h2>'+x[1]+'</h2><p class="mute">'+(p.unlocked.includes(x[0])?'Level '+petLevel(x[0])+' · '+((p.xp[x[0]]||0)%100)+' / 100 XP':(x[3]?x[3]+' richtige Karten · '+Math.min(x[3],S.rewards.count||0)+' / '+x[3]:x[2]+' Tage Streak'))+'</p><button onclick="previewPet(&quot;'+x[0]+'&quot;)">Entwicklung ansehen</button> '+(p.unlocked.includes(x[0])?'<button onclick="equipPet(&quot;'+x[0]+'&quot;)">'+(p.active===x[0]?'Aktiv':'Auswählen')+'</button>':'<button '+(!petEligible(x)?'disabled':'')+' onclick="claimPet(&quot;'+x[0]+'&quot;)">Freischalten</button>')+'</div>').join('')+'</div>')+'<button style="margin-top:12px" onclick="go(&quot;calendar&quot;)">Streak-Belohnungen</button>'}
function petPage(){let p=petData();if(!p.starter)return '<h1>Dein Begleiter</h1>'+starterChoices();let active=PETS.find(x=>x[0]===p.active),xp=p.xp[p.active]||0;let tile=x=>{let owned=p.unlocked.includes(x[0]);return '<article class="card pet43tile '+(owned?'':'pet44locked')+'">'+petArt42(x[0],owned?petLevel(x[0]):1)+'<h3>'+x[1]+'</h3><p class="mute">'+(owned?'Level '+petLevel(x[0]):(x[3]?x[3]+' richtige Karten · '+Math.min(x[3],S.rewards.count||0)+' / '+x[3]:x[2]+' Tage Streak'))+'</p><button onclick="previewPet(&quot;'+x[0]+'&quot;)">Entwicklung</button>'+(owned?'<button '+(p.active===x[0]?'disabled':'')+' onclick="equipPet(&quot;'+x[0]+'&quot;)">'+(p.active===x[0]?'Aktiv':'Auswählen')+'</button>':'<button '+(!petEligible(x)?'disabled':'')+' onclick="claimPet(&quot;'+x[0]+'&quot;)">Freischalten</button>')+'</article>'};return '<h1>Pets</h1><div class="card pet43hero">'+(active?petArt42(active[0],petLevel(active[0])):'')+'<div><p class="mute">Aktiver Begleiter</p><h2>'+(active?active[1]:'Kein Pet')+'</h2>'+(active?cleanXP(active[0]):'')+'</div></div><h2>Meine Pets</h2><div class="pet42grid">'+PETS.filter(x=>x[2]||x[3]||x[0]===p.starter).map(tile).join('')+'</div><p class="mute">10 XP pro richtiger fälliger Karte · 2 XP pro Fokusminute</p>'}
function previewPet(id){let d=document.createElement('dialog');d.className='pet42dialog';d.innerHTML='<h2>Entwicklung · '+PETS.find(x=>x[0]===id)[1]+'</h2><div class="pet42grid">'+[1,2,3,4,5].map(l=>'<div class="card">'+petArt42(id,l)+'<b>Level '+l+'</b><p class="mute">'+["Starter","Wachstum","Verwandlung","Meisterform","Finalform"][l-1]+'</p><p class="mute">'+((l-1)*100)+' XP</p></div>').join('')+'</div><button onclick="this.closest(&quot;dialog&quot;).close()">Schließen</button>';document.body.append(d);d.onclose=()=>d.remove();d.showModal()}
let eventDay='';
function schoolEvents(){return Array.isArray(S.schoolEvents)?S.schoolEvents:(S.schoolEvents=[])}
function eventRows(items){return items.length?items.map(e=>'<button class="event-row" data-event="'+esc(e.id)+'" onclick="eventEdit(this.dataset.event)"><span class="event-dot"></span><span><b>'+esc(e.title)+'</b><small>'+esc(e.type)+' · '+esc(e.date.split('-').reverse().join('.'))+(e.time?' · '+esc(e.time):'')+(e.subject?' · '+esc(e.subject):'')+'</small></span><span class="mute">›</span></button>').join(''):'<p class="mute">Keine Termine eingetragen.</p>'}
function upcomingEvents(){return '<div class="card event-agenda"><div class="row sp"><b>Anstehende Termine</b><button class="g" onclick="eventEdit(null,ymd())">+ Termin</button></div>'+eventRows(schoolEvents().filter(e=>e.date>=ymd()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4))+'</div>'}
function eventEdit(id,date){let e=schoolEvents().find(x=>x.id===id),d=document.createElement('dialog');d.className='event-dialog';let types=[S.settings.upper?'Klausur':'Klassenarbeit','Hausaufgabe','Präsentation','Test','Sonstiges'];if(e&&!types.includes(e.type))types.push(e.type);d.innerHTML='<form><div class="row sp"><h2>'+(e?'Termin bearbeiten':'Neuer Termin')+'</h2><button type="button" class="g" aria-label="Schließen">✕</button></div><label>Was steht an?<input name="title" required maxlength="150" placeholder="z. B. Mathe-Klausur" value="'+esc(e?.title||'')+'"></label><label>Art<select name="type">'+types.map(t=>'<option '+(e?.type===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label><label>Fach (optional)<select name="subject"><option value="">Kein Fach</option>'+[...new Set(S.subjects.map(x=>x.name).concat(e?.subject?[e.subject]:[]))].map(t=>'<option '+(e?.subject===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label><div class="event-form-grid"><label>Datum<input required type="date" name="date" value="'+esc(e?.date||date||ymd())+'"></label><label>Uhrzeit (optional)<input type="time" name="time" value="'+esc(e?.time||'')+'"></label></div><label>Notizen (optional)<textarea name="notes" rows="3">'+esc(e?.notes||'')+'</textarea></label><div class="row sp">'+(e?'<button type="button" class="event-delete">Löschen</button>':'<span></span>')+'<button class="p" type="submit">Speichern</button></div></form>';d.querySelector('.g').onclick=()=>d.close();d.querySelector('form').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),item={id:e?.id||uid()};for(let k of ['title','type','subject','date','time','notes'])item[k]=String(f.get(k)||'').trim();if(!item.title)return;S.schoolEvents=schoolEvents().filter(x=>x.id!==item.id).concat(item);eventDay=item.date;save();d.close();render()};if(e)d.querySelector('.event-delete').onclick=()=>{if(confirm('Termin löschen?')){S.schoolEvents=schoolEvents().filter(x=>x.id!==e.id);save();d.close();render()}};d.onclose=()=>d.remove();document.body.append(d);d.showModal()}
function calendarPage(){let now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+petMonth,1),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cells='<div></div>'.repeat((d.getDay()+6)%7);if(!eventDay)eventDay=ymd();for(let i=1;i<=count;i++){let day=ymd(new Date(d.getFullYear(),d.getMonth(),i)),done=minutes(day)>=10,n=schoolEvents().filter(e=>e.date===day).length;cells+='<button class="pet42day '+(done?'done ':'')+(day===eventDay?'selected':'')+'" data-day="'+day+'" onclick="eventDay=this.dataset.day;render()" aria-label="'+day+', '+n+' Termine"><span>'+i+'</span><small>'+(done?'🔥 ':'')+(n?'• '+n:'')+'</small></button>'}return '<h1>Kalender</h1><p class="mute">'+streak()+' Tage Streak · '+bestStreak()+' Rekord</p><div class="card"><div class="row sp"><button class="cal-arrow" aria-label="Vorheriger Monat" onclick="petMonth--;eventDay=ymd(new Date(new Date().getFullYear(),new Date().getMonth()+petMonth,1));render()">‹</button><b>'+d.toLocaleDateString('de-DE',{month:'long',year:'numeric'})+'</b><button class="cal-arrow" aria-label="Nächster Monat" onclick="petMonth++;eventDay=ymd(new Date(new Date().getFullYear(),new Date().getMonth()+petMonth,1));render()">›</button></div><div class="pet42calendar">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>'<b>'+x+'</b>').join('')+cells+'</div></div><div class="card event-agenda"><div class="row sp"><b>'+eventDay.split('-').reverse().join('.')+'</b><button class="p" onclick="eventEdit(null,eventDay)">+ Termin</button></div>'+eventRows(schoolEvents().filter(e=>e.date===eventDay).sort((a,b)=>a.time.localeCompare(b.time)))+'</div><h2>Streak-Belohnungen</h2><div class="pet42grid">'+PETS.filter(x=>x[2]).map(x=>'<div class="card">'+petArt42(x[0],1)+'<b>'+x[1]+'</b><p class="mute">'+x[2]+' Tage in Folge</p><button onclick="previewPet(&quot;'+x[0]+'&quot;)">Vorschau</button> <button '+(!petData().starter||bestStreak()<x[2]||petData().unlocked.includes(x[0])?'disabled':'')+' onclick="claimPet(&quot;'+x[0]+'&quot;)">'+(petData().unlocked.includes(x[0])?'Gesammelt':'Freischalten')+'</button></div>').join('')+'</div><button onclick="go(&quot;pets&quot;)">Meine Pets</button>'}

<script>
(()=>{let promptEvent,registration; const install=document.getElementById('pwa-install'),update=document.getElementById('pwa-update');const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;function refresh(){install.hidden=standalone();document.body.classList.toggle('pwa-browser',!install.hidden||!update.hidden)}refresh();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;refresh()});window.addEventListener('appinstalled',()=>{promptEvent=null;refresh()});install.onclick=async()=>{if(promptEvent){const e=promptEvent;promptEvent=null;await e.prompt();return}document.getElementById('pwa-help').textContent=location.protocol==='file:'?'Öffne zuerst die veröffentlichte HTTPS-Website.':/iPhone|iPad|iPod/i.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1?'In Safari: Teilen → Zum Home-Bildschirm → Hinzufügen.':'Öffne das Browsermenü und wähle App installieren oder Zum Startbildschirm hinzufügen, sofern verfügbar.';document.getElementById('pwa-dialog').showModal()};if('serviceWorker' in navigator&&location.protocol!=='file:'){let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)location.reload()});navigator.serviceWorker.register('./sw.js').then(r=>{registration=r;function ready(){if(r.waiting&&navigator.serviceWorker.controller){update.hidden=false;refresh()}}ready();r.addEventListener('updatefound',()=>{if(r.installing)r.installing.addEventListener('statechange',ready)});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});}).catch(console.warn);update.onclick=()=>{if(registration?.waiting){reloading=true;registration.waiting.postMessage('SKIP_WAITING')}}}})();
</script></body>
